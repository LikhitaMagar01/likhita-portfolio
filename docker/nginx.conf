server {
    # matches EXPOSE 5173 in the Dockerfile
    listen 5173;
    server_name localhost;

    # this is where the Dockerfile copied the built dist/ folder to
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # if the file/folder doesn't exist, fall back to index.html
        # need this for when I add vue-router later, otherwise refreshing
        # on a route like /projects would just 404
        try_files $uri $uri/ /index.html;
    }

    # vite adds a hash to filenames when it builds (like index-a1b2c3.js)
    # so it's safe to cache these hard, a new build = a new filename anyway
    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpe?g|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # compress text-based files before sending them over the network
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
